name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: draft release
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      # git-cliff writes the notes from the commit history, so it needs one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: bun install --frozen-lockfile
        working-directory: app
      - name: Stamp the version from the tag
        run: bun run scripts/set-version.ts "${GITHUB_REF_NAME}"
      - name: Write the notes from the commits
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: NOTES.md
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: IconState ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.content }}
          releaseDraft: true
          prerelease: false
          args: --bundles app,dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set these and the build is signed and notarised, and opens by
          # double-click. Without them it is ad-hoc signed, and the install
          # script has to clear the quarantine flag. Needs a paid membership.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Check the bundle
        run: ./scripts/verify-bundle.sh
