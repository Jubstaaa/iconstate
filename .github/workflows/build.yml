name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: macOS arm64 dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: bun install --frozen-lockfile
        working-directory: app
      - name: Build the app
        run: bun run tauri build --bundles app,dmg
        working-directory: app
        # The config asks for updater artifacts, and Tauri refuses to build them
        # against a public key with no private one — so this job needs the key
        # too, not just the release job.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Check the bundle
        run: ./scripts/verify-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: IconState-aarch64-apple-darwin
          path: app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
