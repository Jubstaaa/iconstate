[package]
name = "iconstate"
version = "0.0.0"
description = "iPhone home screen editor"
authors = ["İlker Balcılar"]
edition = "2021"

[lib]
name = "iconstate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exactly: idevice ships breaking changes on every point release until 0.2.
idevice = { version = "=0.1.65", features = ["usbmuxd", "springboardservices", "installation_proxy"] }
plist = "1.10"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
