[package]
name = "iconstate"
version = "0.1.2"
description = "iPhone home screen editor"
authors = ["İlker Balcılar"]
license = "MIT"
repository = "https://github.com/Jubstaaa/iconstate"
edition = "2021"

[lib]
name = "iconstate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exactly: idevice ships breaking changes on every point release until 0.2.
idevice = { version = "=0.1.68", features = ["usbmuxd", "springboardservices"] }
plist = "1.10"
base64 = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "query"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
dirs = "7"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
